name: protected-paths

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block protected paths
        env:
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'human-override:protected-paths') }}
        run: |
          # Kern-Logik in scripts/ci/check-protected-paths.sh (single source of
          # truth, auch vom Selbsttest-Harness getestet). Hier nur das Umfeld-Glue:
          # geänderte Pfade ermitteln und hineinreichen.
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            | OVERRIDE="$OVERRIDE" bash scripts/ci/check-protected-paths.sh
