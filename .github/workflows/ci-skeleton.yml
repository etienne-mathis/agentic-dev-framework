##############################################################################
# CI-SKELETON — projektspezifisch anpassen, dann umbenennen zu ci.yml
#
# Dieser Workflow stellt die Required Status Checks bereit, die Branch
# Protection erzwingt. Ohne grüne Checks kann kein PR gemergt werden.
#
# Anpassen:
#   1. `on.push.branches` und `on.pull_request.branches` ggf. ergänzen
#   2. `setup-python` Version anpassen
#   3. Unter jedem Job die Run-Befehle mit den Werten aus CLAUDE.md befüllen:
#      - befehle.test     → in job: test
#      - befehle.lint     → in job: gates
#      - befehle.typecheck → in job: gates
#      - befehle.gate     → in job: gates (vollständig)
#   4. Für Node-Projekte: python-Steps durch node-Steps ersetzen
##############################################################################

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:

  # ── JOB: test ─────────────────────────────────────────────────────────────
  # Required Check: test
  # Läuft die vollständige Testsuite. Muss grün sein bevor Review möglich.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # ← projektspezifisch anpassen

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen    # ← oder: pip install -r requirements.txt

      - name: Run tests
        run: |
          uv run pytest       # ← befehle.test aus CLAUDE.md

  # ── JOB: gates ────────────────────────────────────────────────────────────
  # Required Check: gates
  # Lint + Typecheck + Coverage-Diff + Layer-Check + Glossar-Gate.
  # Vollständig = befehle.gate aus CLAUDE.md.
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # nötig für diff-cover und glossar_gate.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen

      - name: Run gates
        run: |
          # ← befehle.gate aus CLAUDE.md vollständig einfügen:
          uv run ruff check .
          uv run mypy src
          uv run pytest --cov --cov-report=xml
          uv run diff-cover coverage.xml \
            --compare-branch=origin/main \
            --fail-under=90
          bash scripts/glossar_gate.sh

  # ── JOB: audit ────────────────────────────────────────────────────────────
  # Required Check: audit
  # Dependency-Vulnerabilität auf Basis von audit.block_ab aus CLAUDE.md.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit uv && uv sync --frozen

      - name: Run pip-audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BLOCK_AB=$(grep 'block_ab:' CLAUDE.md | head -1 | grep -oE '(critical|high|medium|low)')
          pip-audit --format json > /tmp/audit.json 2>/dev/null || true
          python3 - "$BLOCK_AB" /tmp/audit.json << 'PYEOF'
          import json, sys
          SEVERITY_ORDER = ["low", "medium", "high", "critical"]
          block_ab = sys.argv[1] if len(sys.argv) > 1 else "high"
          threshold = SEVERITY_ORDER.index(block_ab)
          with open(sys.argv[2]) as f:
              data = json.load(f)
          blocking = []
          for dep in data.get("dependencies", []):
              for vuln in dep.get("vulns", []):
                  sev = vuln.get("fix_versions", [""])[0]  # approximate
                  blocking.append(f"{dep['name']} {vuln['id']}")
          if blocking:
              print("Blocking vulnerabilities found:")
              for b in blocking: print(f"  {b}")
              sys.exit(1)
          print("No blocking vulnerabilities.")
          PYEOF

  # ── JOB: commitlint ───────────────────────────────────────────────────────
  # Required Check: commitlint
  # Prüft alle Commits im PR auf die Konvention: type(scope): text (#nr)
  # Erlaubte Typen: feat|fix|refactor|test|docs|chore
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=50

          PATTERN='^(feat|fix|refactor|test|docs|chore)(\([a-z0-9_-]+\))?: .{1,100} \(#[0-9]+\)$'
          FAILED=0

          git log "${BASE}..HEAD" --format="%s" | while read MSG; do
            if ! echo "$MSG" | grep -qE "$PATTERN"; then
              echo "::error::Ungültige Commit-Message: '$MSG'"
              echo "Erwartet: type(scope): kurze beschreibung (#issue-nr)"
              echo "Typen: feat|fix|refactor|test|docs|chore"
              FAILED=1
            fi
          done

          exit $FAILED
