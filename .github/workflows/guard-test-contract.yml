name: test-contract

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce acceptance-contract immutability
        env:
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'human-override:test-contract') }}
        run: |
          # Regel-Logik (1–4) in scripts/ci/check-test-contract.sh (single source
          # of truth, auch vom Selbsttest-Harness getestet). Hier nur das Umfeld-
          # Glue: Story-Nummer aus dem Branch, Basis-Fetch, Label→OVERRIDE.
          NR=$(echo "${{ github.head_ref }}" | grep -oE '^story/[0-9]+' | grep -oE '[0-9]+' || true)
          if [ -z "$NR" ]; then
            echo "Kein story/-Branch — Guard übersprungen."
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=50
          OVERRIDE="$OVERRIDE" bash scripts/ci/check-test-contract.sh \
            "$NR" "origin/${{ github.base_ref }}"
